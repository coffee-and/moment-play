name: App CI

on:
  workflow_call:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static quality gates
        run: npm run quality

      - name: Run application tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:e2e

  database-contracts:
    name: Database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start isolated database
        run: npx supabase db start

      - name: Lint database schema
        run: npx supabase db lint --local --schema public --level warning --fail-on warning

      - name: Run database contract tests
        run: npm run test:db

      - name: Check database security advisors
        run: npm run check:db-advisors

      - name: Stop isolated database
        if: always()
        run: npx supabase stop --no-backup
